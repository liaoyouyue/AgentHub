[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-observer"
version = "0.2.0"
description = "Portable real-time multi-agent observability and visualization bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "liaoyouyue" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
agenthub-mcp = "agenthub.mcp_server:main"

[tool.setuptools]
packages = ["agenthub"]
py-modules = ["server"]
